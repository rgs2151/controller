[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-steerability"
version = "0.1.0"
description = "Research code for robust control of language-model representation dynamics under distribution shift."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "accelerate",
  "bitsandbytes",
  "datasets==4.4.2",
  "h5py",
  "huggingface-hub",
  "joblib",
  "matplotlib>=3.8",
  "numpy",
  "pandas",
  "protobuf",
  "pykakasi==2.3.0",
  "scikit-learn",
  "scipy",
  "seaborn",
  "sentencepiece",
  "torch==2.9.1",
  "tqdm",
  "transformers==4.57.1",
]

[project.optional-dependencies]
notebook = [
  "ipykernel",
  "jupyterlab",
]
test = [
  "pytest",
]

[tool.setuptools.packages.find]
include = ["robust_steerability*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
