[stages]
order = ["artifacts", "calibrate", "evaluate", "score"]
evaluation_requires_selected_calibration = true
evaluation_generates_only = true
score_reads_completed_generations = true

[calibration]
selection_metric = "mgsm_quality_composite"
available_selection_metrics = ["mean_axbench_overall", "mgsm_quality_composite"]
h_infinity_disturbance_samples = 200
h_infinity_tuning_samples = 50
h_infinity_tuning_repetitions = 1
h_infinity_fixed_selection_supported = true
h_infinity_calibration_languages = ["bn", "de", "ru", "th"]

[calibration.mgsm_quality_composite]
aggregation = "mean_per_response_weighted_additive"
mgsm_exact_match_weight = 0.90
axbench_overall_weight = 0.10
axbench_score_normalizer = 2.0

[calibration.h_infinity_lambda_sweep]
enabled = false
values = [0.1, 0.25, 0.5, 0.75, 1.0, 1.5]
fixed_q_over_r = 0.1
fixed_q_final_over_r = 0.1
fixed_r = 1.0
selection_metric = "mean_axbench_overall"

[storage]
remote_cache_backend = "lightning_teamspace_drive"
remote_cache_scope = "all_cache_stages"
tracked_outputs = ["results", "logs"]
