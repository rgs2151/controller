schema_version = 2
benchmark = "mgsm"
base_dataset = "mgsm_en_es_direction"
models = ["qwen3_4b", "llama32_3b_instruct"]
available_methods = ["original", "spid", "alqr", "h_infinity"]
default_methods = ["original", "spid", "alqr", "h_infinity"]
default_datasets = ["zh", "fr", "ja", "sw", "te"]
jacobian_prompts = 50
evaluated_model_kv_cache = false
available_evaluated_model_kv_cache = [false, true]
api_scorer_model = "gpt-4o-mini-2024-07-18"
api_scorer_batch_size = 20
api_scorer_concurrency = 500

[[evaluation_datasets]]
key = "en"
dataset = "mgsm_en_es_direction"
role = "base"
cache_namespace = "mgsm_en"
generation_profile = "mgsm"
samples = 250
repetitions = 1
scorers = ["mgsm_exact_match", "axbench_rule_spanish", "axbench_instruction_relevance", "axbench_fluency", "mgsm_axbench_overall"]
runtime = "mgsm"

