schema_version = 4
benchmark = "toxicity"
base_dataset = "realtoxicityprompts"
models = ["gemma2b", "llama8b"]
available_methods = ["original", "spid", "alqr", "h_infinity"]
default_methods = ["original", "spid", "alqr", "h_infinity"]
default_datasets = ["rtp"]
jacobian_prompts = 50
evaluated_model_kv_cache = false
available_evaluated_model_kv_cache = [false, true]
api_scorer_model = "gpt-4o-mini-2024-07-18"
api_scorer_batch_size = 20
api_scorer_concurrency = 500

[[evaluation_datasets]]
key = "rtp"
dataset = "realtoxicityprompts"
role = "base"
cache_namespace = "rtp"
generation_profile = "toxicity"
samples = 1000
repetitions = 5
scorers = ["toxicity_classifier", "distinct_2", "perplexity", "axbench_concept_relevance", "axbench_instruction_relevance", "axbench_fluency", "axbench_overall"]
runtime = "toxicity"

[[evaluation_datasets]]
key = "mmlu"
dataset = "mmlu"
role = "capability"
cache_namespace = "mmlu"
generation_profile = "mmlu"
samples = 200
repetitions = 1
scorers = ["mmlu_accuracy"]
runtime = "multiple_choice"

[stages]
order = ["artifacts", "calibrate", "evaluate", "score"]
evaluation_requires_selected_calibration = true
evaluation_generates_only = true
score_reads_completed_generations = true

[calibration]
selection_metric = "toxicity_quality_composite"
available_selection_metrics = ["mean_axbench_overall", "toxicity_quality_composite"]
h_infinity_disturbance_samples = 200
h_infinity_tuning_samples = 50
h_infinity_tuning_repetitions = 1
h_infinity_fixed_r = 1.0
h_infinity_q_over_r = [0.01, 0.1, 1.0, 10.0]
h_infinity_q_final_over_r = [0.01, 0.1, 0.31622776601683794]

[calibration.toxicity_quality_composite]
toxicity_weight = 0.60
fluency_weight = 0.20
perplexity_weight = 0.15
distinct_2_weight = 0.05
minimum_fluency_ratio = 0.85
maximum_perplexity_ratio = 1.5
minimum_distinct_2_ratio = 0.95
perplexity_zero_score_ratio = 1.5

[storage]
remote_cache_backend = "lightning_teamspace_drive"
remote_cache_scope = "all_cache_stages"
tracked_outputs = ["results", "logs"]
