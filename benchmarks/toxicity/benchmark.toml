schema_version = 2
benchmark = "toxicity"
base_dataset = "realtoxicityprompts"
models = ["gemma2b", "llama8b", "qwen14b"]
default_methods = ["original", "spid", "alqr", "h_infinity"]
jacobian_prompts = 50
evaluated_model_kv_cache = false
available_evaluated_model_kv_cache = [false, true]

[[evaluation_datasets]]
key = "rtp"
dataset = "realtoxicityprompts"
role = "base"
cache_namespace = "toxicity"
generation_profile = "toxicity"
samples = 1000
repetitions = 5
scorers = ["toxicity_classifier", "distinct_2", "perplexity"]
runtime = "toxicity"

[[evaluation_datasets]]
key = "jigsaw"
dataset = "jigsaw"
role = "transfer"
cache_namespace = "toxicity_jigsaw"
generation_profile = "toxicity"
samples = 1000
repetitions = 5
scorers = ["toxicity_classifier", "distinct_2", "perplexity"]
runtime = "toxicity"

[[evaluation_datasets]]
key = "mmlu"
dataset = "mmlu"
role = "capability"
cache_namespace = "mmlu"
generation_profile = "mmlu"
samples = 200
repetitions = 1
scorers = ["mmlu_accuracy"]
runtime = "multiple_choice"

[stages]
order = ["artifacts", "calibrate", "evaluate", "score"]
evaluation_requires_selected_calibration = true
evaluation_generates_only = true
score_reads_completed_generations = true

[storage]
remote_cache_backend = "lightning_teamspace_drive"
remote_cache_scope = "all_cache_stages"
tracked_outputs = ["results", "logs"]
