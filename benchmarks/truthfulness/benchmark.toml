schema_version = 4
benchmark = "truthfulness"
base_dataset = "truthfulqa"
models = ["gemma2b", "llama8b", "qwen14b"]
available_methods = ["original", "iti", "actadd", "mean_act", "linear_act", "pid_act", "odesteer", "spid", "alqr", "h_infinity"]
default_methods = ["original", "alqr", "h_infinity"]
jacobian_prompts = 35
evaluated_model_kv_cache = false
available_evaluated_model_kv_cache = [false, true]
api_scorer_model = "gpt-4o-mini"
api_scorer_batch_size = 20
api_scorer_concurrency = 500

[[evaluation_datasets]]
key = "id"
dataset = "truthfulqa"
role = "base"
cache_namespace = "truthfulness"
generation_profile = "truthfulness"
samples = 817
repetitions = 5
scorers = ["truthfulqa_true", "truthfulqa_informative", "axbench_instruction_relevance", "axbench_fluency"]
runtime = "truthfulness"

[[evaluation_datasets]]
key = "spanish"
dataset = "truthfulqa_spanish"
role = "transfer"
cache_namespace = "truthfulness_spanish"
generation_profile = "truthfulness"
samples = 817
repetitions = 5
scorers = ["truthfulqa_true", "truthfulqa_informative", "axbench_instruction_relevance", "axbench_fluency"]
runtime = "truthfulness"

[[evaluation_datasets]]
key = "mmlu"
dataset = "mmlu"
role = "capability"
cache_namespace = "mmlu"
generation_profile = "mmlu"
samples = 200
repetitions = 1
scorers = ["mmlu_accuracy"]
runtime = "multiple_choice"

[stages]
order = ["artifacts", "calibrate", "evaluate", "score"]
evaluation_requires_selected_calibration = true
evaluation_generates_only = true
score_reads_completed_generations = true

[calibration]
selection_metric = "truthfulqa_true_mean_percentage"
h_infinity_tuning_samples = 50
h_infinity_tuning_repetitions = 1
h_infinity_fixed_selection_supported = true

[storage]
remote_cache_backend = "lightning_teamspace_drive"
remote_cache_scope = "all_cache_stages"
tracked_outputs = ["results", "logs"]
