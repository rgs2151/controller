schema_version = 1
benchmark = "truthfulness"
fit_dataset = "truthfulqa"
transfer_datasets = ["truthfulqa_spanish"]
models = ["gemma2b", "llama8b", "qwen14b"]
default_methods = ["original", "alqr", "h_infinity"]
evaluation_repetitions = 5
evaluation_samples_per_repetition = 817
jacobian_prompts = 35
evaluated_model_kv_cache = false
quality_judge_model = "gpt-4o-mini"
quality_judge_metrics = ["instruction_relevance_0_2", "fluency_0_2"]
quality_judge_batch_size = 20

[stages]
order = ["artifacts", "calibrate", "evaluate"]
evaluation_requires_selected_calibration = true

[storage]
large_s3_stages = ["artifacts", "calibration"]
tracked_outputs = ["results", "logs"]
