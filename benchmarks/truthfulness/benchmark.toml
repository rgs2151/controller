schema_version = 4
benchmark = "truthfulness"
base_dataset = "truthfulqa"
models = ["gemma2b", "llama8b", "qwen14b", "qwen32b", "gpt2_xl", "qwen25_05b"]
available_methods = ["original", "iti", "actadd", "mean_act", "linear_act", "pid_act", "odesteer", "spid", "alqr", "h_infinity"]
default_methods = ["original", "alqr", "h_infinity"]
default_datasets = ["id", "spanish", "mmlu"]
jacobian_prompts = 35
evaluated_model_kv_cache = false
available_evaluated_model_kv_cache = [false, true]
api_scorer_model = "gpt-4o-mini"
api_scorer_batch_size = 20
api_scorer_concurrency = 500

[[evaluation_datasets]]
key = "id"
dataset = "truthfulqa"
role = "base"
cache_namespace = "truthfulness"
generation_profile = "truthfulness"
samples = 817
repetitions = 1
scorers = ["truthfulqa_true", "truthfulqa_informative", "axbench_concept_relevance", "axbench_instruction_relevance", "axbench_fluency", "axbench_overall"]
runtime = "truthfulness"

[[evaluation_datasets]]
key = "spanish"
dataset = "truthfulqa_spanish"
role = "transfer"
cache_namespace = "truthfulness_spanish"
generation_profile = "truthfulness"
samples = 817
repetitions = 1
scorers = ["truthfulqa_true", "truthfulqa_informative", "axbench_concept_relevance", "axbench_instruction_relevance", "axbench_fluency", "axbench_overall"]
runtime = "truthfulness"

[[evaluation_datasets]]
key = "mmlu"
dataset = "mmlu"
role = "capability"
cache_namespace = "mmlu"
generation_profile = "mmlu"
samples = 200
repetitions = 1
scorers = ["mmlu_accuracy"]
runtime = "multiple_choice"

[stages]
order = ["artifacts", "calibrate", "evaluate", "score"]
evaluation_requires_selected_calibration = true
evaluation_generates_only = true
score_reads_completed_generations = true

[calibration]
selection_metric = "truthfulqa_txi_fluency_composite"
available_selection_metrics = ["truthfulqa_txi", "truthfulqa_txi_fluency_composite", "truthfulqa_true_mean_percentage", "mean_axbench_overall", "truthfulness_quality_composite"]
h_infinity_tuning_samples = 200
h_infinity_tuning_repetitions = 1
h_infinity_fixed_selection_supported = true

[calibration.truthfulqa_txi]
aggregation = "aggregate_product"

[calibration.truthfulqa_txi_fluency_composite]
aggregation = "aggregate_product_weighted_sum"
truthfulqa_true_informative_weight = 0.95
axbench_fluency_weight = 0.05
axbench_score_normalizer = 2.0

[calibration.truthfulness_quality_composite]
aggregation = "mean_per_response_weighted_harmonic"
truthfulqa_true_weight = 0.50
axbench_instruction_relevance_weight = 0.25
axbench_fluency_weight = 0.25
axbench_score_normalizer = 2.0
zero_component_score = 0.0

[storage]
remote_cache_backend = "lightning_teamspace_drive"
remote_cache_scope = "all_cache_stages"
tracked_outputs = ["results", "logs"]
