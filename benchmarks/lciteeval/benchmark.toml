schema_version = 2
benchmark = "lciteeval"
base_dataset = "lciteeval_length_hotpotqa"
models = ["qwen25_3b_instruct", "llama31_8b_instruct"]
available_methods = ["original", "spid", "alqr", "h_infinity"]
default_methods = ["original", "spid", "alqr", "h_infinity"]
default_datasets = ["8k", "16k"]
jacobian_prompts = 50
evaluated_model_kv_cache = false
available_evaluated_model_kv_cache = [false, true]
api_scorer_model = "gpt-4o-mini-2024-07-18"
api_scorer_batch_size = 20
api_scorer_concurrency = 500

[[evaluation_datasets]]
key = "8k"
dataset = "lciteeval_length_hotpotqa"
role = "base"
cache_namespace = "hotpotqa_8k"
generation_profile = "lciteeval"
samples = 40
repetitions = 1
scorers = ["lcite_answer_overlap", "lcite_citation_nli", "axbench_concept_relevance", "axbench_instruction_relevance", "axbench_fluency", "axbench_overall"]
runtime = "lciteeval"

[[evaluation_datasets]]
key = "16k"
dataset = "lciteeval_length_hotpotqa"
role = "transfer"
cache_namespace = "hotpotqa_16k"
generation_profile = "lciteeval"
samples = 40
repetitions = 1
scorers = ["lcite_answer_overlap", "lcite_citation_nli", "axbench_concept_relevance", "axbench_instruction_relevance", "axbench_fluency", "axbench_overall"]
runtime = "lciteeval"

[[evaluation_datasets]]
key = "32k"
dataset = "lciteeval_length_hotpotqa"
role = "transfer"
cache_namespace = "hotpotqa_32k"
generation_profile = "lciteeval"
samples = 40
repetitions = 1
scorers = ["lcite_answer_overlap", "lcite_citation_nli", "axbench_concept_relevance", "axbench_instruction_relevance", "axbench_fluency", "axbench_overall"]
runtime = "lciteeval"

[stages]
order = ["artifacts", "calibrate", "evaluate", "score"]
evaluation_requires_selected_calibration = true
evaluation_generates_only = true
score_reads_completed_generations = true

[calibration]
selection_metric = "0.45_answer_recall_plus_0.45_citation_f1_plus_0.05_concept_relevance_plus_0.05_fluency"
h_infinity_disturbance_samples = 200
h_infinity_tuning_dataset = "lciteeval_length_hotpotqa_8k"
h_infinity_tuning_samples = 40
h_infinity_tuning_repetitions = 1
h_infinity_fixed_selection_supported = true

[storage]
remote_cache_backend = "lightning_teamspace_drive"
remote_cache_scope = "all_cache_stages"
tracked_outputs = ["results", "logs"]
